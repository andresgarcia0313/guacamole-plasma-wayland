# Publishes the Guacamole of a desktop through Traefik (k3s) with Let's Encrypt.
# Replace: remote.example.com (your domain), 100.64.0.10 (address of the desktop reachable from Traefik,
# for example its Tailscale IP) and 8087 (GP_PORT). Then: kubectl apply -f traefik-k3s.yaml
# Set GP_BIND to that address (or 0.0.0.0 plus firewall) and GP_TRUSTED_PROXY to Traefik's address.
apiVersion: v1
kind: Namespace
metadata:
  name: remote-desktop
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole
  namespace: remote-desktop
spec:
  ports:
    - name: http
      port: 8087
      targetPort: 8087
---
# ExternalName is not used: Traefik ignores it unless allowExternalNameServices is enabled
apiVersion: v1
kind: Endpoints
metadata:
  name: guacamole
  namespace: remote-desktop
subsets:
  - addresses:
      - ip: 100.64.0.10
    ports:
      - name: http
        port: 8087
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: remote-desktop
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
  namespace: remote-desktop
spec:
  rateLimit:
    average: 40
    period: 1s
    burst: 120
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: guacamole-http
  namespace: remote-desktop
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`remote.example.com`)
      middlewares:
        - name: redirect-https
      services:
        - name: guacamole
          port: 8087
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: guacamole-https
  namespace: remote-desktop
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`remote.example.com`)
      middlewares:
        - name: ratelimit
      services:
        - name: guacamole
          port: 8087
  tls:
    certResolver: letsencrypt

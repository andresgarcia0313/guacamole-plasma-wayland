[Service]
# Re-applies (idempotent) the portal pre-authorization before every start: if the permission store is
# reset, it heals itself and the "Remote control" dialog does not come back.
ExecStartPre=-/usr/bin/gdbus call --session --dest org.freedesktop.impl.portal.PermissionStore --object-path /org/freedesktop/impl/portal/PermissionStore --method org.freedesktop.impl.portal.PermissionStore.SetPermission kde-authorized true remote-desktop org.kde.krfb "['yes']"
ExecStartPre=-/usr/bin/gdbus call --session --dest org.freedesktop.impl.portal.PermissionStore --object-path /org/freedesktop/impl/portal/PermissionStore --method org.freedesktop.impl.portal.PermissionStore.SetPermission kde-authorized true screencast org.kde.krfb "['yes']"
